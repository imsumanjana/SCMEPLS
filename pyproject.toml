[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scmepls-analysis-studio"
version = "1.1.1"
description = "PyQt6 analysis studio for hybrid maglev-mechanical rocket launchpad transport analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyQt6>=6.7",
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "trimesh>=4.4",
  "pyvista>=0.44",
  "pyvistaqt>=0.11"
]

[project.scripts]
scmepls-studio = "scmepls_studio.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
